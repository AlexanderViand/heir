# SkyPilot config for the migrated scale-snu/cheddar tests in default (debug)
# compilation mode on a GPU instance. It runs the ordinary repository suite
# first, then explicitly opts the real Cheddar compile/runtime targets into the
# scale-snu dependency and GPU toolchain.
#
# Usage: sky launch -c heir-cheddar-dbg -i 10 sky/cheddar_add_e2e.yaml
#
# Uses nvidia/cuda Ubuntu 24.04 base image for clang + CUDA compatibility.

name: heir-cheddar-dbg

# assumes we'll call this from the repo root
workdir: .

resources:
  accelerators: A10G:1
  cpus: 64+
  memory: 128+
  disk_size: 200
  cloud: aws
  image_id: docker:nvidia/cuda:12.9.1-cudnn-devel-ubuntu24.04
  autostop:
    idle_minutes: 10

setup: |
  set -ex

  apt-get update -qq
  apt-get install -y -qq \
    clang cmake g++ lld libomp-dev llvm ninja-build pkg-config \
    zlib1g-dev \
    libtommath-dev libjsoncpp-dev \
    libcusparselt0 \
    git wget pip

  if ! command -v bazel &> /dev/null; then
    wget -q https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64 -O /usr/local/bin/bazel
    chmod +x /usr/local/bin/bazel
  fi

run: |
  set -ex
  bazel test //... --test_output=errors --test_timeout=1800
  bazel fetch \
    //tests/Conversions/CheddarToEmitC/compile:real_compile_test \
    //tests/Conversions/CheddarToEmitC/compile:real_setup_compile_test \
    //tests/Examples/cheddar/emitc_abi:abi_test \
    //tests/Examples/cheddar/add_e2e:add_e2e_test \
    //tests/Examples/cheddar/bootstrap:bootstrap_test \
    //tests/Examples/cheddar/configure_smoke:configure_smoke_test \
    //tests/Examples/cheddar/generated_bootstrap_setup:generated_bootstrap_setup_test \
    //tests/Examples/cheddar/pipeline_eval_chebyshev:pipeline_eval_chebyshev_test \
    //tests/Examples/cheddar/pipeline_matvec:pipeline_matvec_test \
    //tests/Examples/cheddar/pipeline_mlp:pipeline_mlp_test \
    --config=cheddar
  bazel test \
    //tests/Conversions/CheddarToEmitC/compile:real_compile_test \
    //tests/Conversions/CheddarToEmitC/compile:real_setup_compile_test \
    //tests/Examples/cheddar/emitc_abi:abi_test \
    //tests/Examples/cheddar/add_e2e:add_e2e_test \
    //tests/Examples/cheddar/bootstrap:bootstrap_test \
    //tests/Examples/cheddar/configure_smoke:configure_smoke_test \
    //tests/Examples/cheddar/generated_bootstrap_setup:generated_bootstrap_setup_test \
    //tests/Examples/cheddar/pipeline_eval_chebyshev:pipeline_eval_chebyshev_test \
    //tests/Examples/cheddar/pipeline_matvec:pipeline_matvec_test \
    //tests/Examples/cheddar/pipeline_mlp:pipeline_mlp_test \
    --config=cheddar --test_output=all --test_timeout=1800
  echo "## DONE ##"
